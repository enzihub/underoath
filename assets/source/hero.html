<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:Cinzel;src:url(../../docs/fonts/cinzel-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:Cinzel;src:url(../../docs/fonts/cinzel-600.woff2) format('woff2');font-weight:600}
@font-face{font-family:Inter;src:url(../../docs/fonts/inter-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:Inter;src:url(../../docs/fonts/inter-600.woff2) format('woff2');font-weight:600}
*{box-sizing:border-box;margin:0;padding:0} html,body{background:transparent;-webkit-font-smoothing:antialiased}
.card{position:relative;overflow:hidden;border-radius:28px;background:#0a0810;color:#efeaf6;font-family:Inter,sans-serif}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.cz{font-family:Cinzel,serif;font-weight:700;letter-spacing:.06em}
.shot{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.7)}
.shot img{display:block;width:100%}
.key{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(181,140,255,.35);background:rgba(120,80,200,.12);border-radius:10px;padding:7px 12px 7px 7px;font-size:13.5px;color:#ddd3f2}
.key b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#1c1530;border:1px solid #8f6ae8;color:#d9c8ff;font:700 13px Cinzel}
.cap{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#b3a8c9;margin:0 0 8px 2px}

.card{width:1000px;height:540px}
.bgmap{position:absolute;inset:0;background:url(../../public/assets/images/world_map.jpg) center/cover;opacity:.16;filter:saturate(.6)}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,#0a0810 0%,rgba(10,8,16,.92) 40%,rgba(10,8,16,.35) 100%)}
.left{position:absolute;left:52px;top:52px;width:420px;z-index:3}
.tag{font:600 11.5px Inter;letter-spacing:.2em;text-transform:uppercase;color:#a48be0}
h1{font-size:62px;line-height:1;margin:16px 0 16px;color:#f4eefc;text-shadow:0 0 40px rgba(150,100,255,.35)}
p.sub{font-size:16.5px;line-height:1.55;color:#c9c0da}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:26px;width:400px}
.foot{position:absolute;left:52px;bottom:40px;font-size:13px;color:#8d84a3;z-index:3}
.s1{position:absolute;left:470px;top:46px;width:500px;z-index:2;transform:rotate(-1.4deg)}
.s2{position:absolute;left:600px;top:290px;width:360px;z-index:3;transform:rotate(1.8deg)}
.knight{position:absolute;left:450px;top:318px;width:180px;z-index:4;filter:drop-shadow(0 0 18px rgba(150,110,255,.55))}
</style></head><body><div class=card>
<div class=bgmap></div><div class=veil></div>
<div class=glow style="width:560px;height:420px;left:500px;top:-180px;background:#5b21b6;opacity:.5"></div>
<div class=glow style="width:360px;height:280px;left:-120px;top:360px;background:#0d9488;opacity:.22"></div>
<div class=left>
 <div class=tag>Browser action RPG &middot; Phaser 3</div>
 <h1 class=cz>UNDER<br>OATH</h1>
 <p class=sub>Fight your way through a cursed glade of shadow beasts with four spells. Runs in any modern browser, no install.</p>
 <div class=keys>
  <span class=key><b>Q</b>Shadow Strike</span><span class=key><b>W</b>Protective Aura</span>
  <span class=key><b>E</b>Void Rush</span><span class=key><b>R</b>Darkfall</span>
 </div>
</div>
<div class="s1 shot"><img src="../screenshots/shadow-strike.jpg"></div>
<div class="s2 shot"><img src="../screenshots/darkfall.jpg"></div>
<img class=knight src="../../public/assets/images/hero/oathknight.png">
</div></body></html>
